[project]
name = "gemma-agent-dev"
version = "0.1.0"
description = "Reproducible Gemma 4 competition evaluation and result CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
gemma-dev = "gemma_agent_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_agent_dev"]

[dependency-groups]
submission = ["kaggle==2.2.4"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML>=6,<7", "coverage>=7.10,<8"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "artifacts/cache/mypy"
files = ["src", "tests", "kaggle", "scripts"]

[[tool.mypy.overrides]]
module = ["swegemma.*", "adk_submission.*", "adk_eval_core.*", "google.adk.*", "google.genai.*", "litellm", "torch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/cache/pytest"
addopts = "--basetemp=artifacts/tmp/pytest"

[tool.coverage.run]
branch = true
source = ["gemma_agent_dev", "kaggle", "scripts"]
data_file = "artifacts/coverage/.coverage"
relative_files = true

[tool.coverage.paths]
package = ["src/gemma_agent_dev", "*/site-packages/gemma_agent_dev"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.json]
output = "artifacts/coverage/coverage.json"

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage_gate]
line = 90
branch = 80

[tool.gemma_agent_dev.results]
max_artifact_bytes = 2000000

[tool.architecture]
gpu_free_roles = ["core", "settings", "diagnostic", "local", "cli", "quality", "operations"]
inference_imports = ["torch", "litellm", "swegemma", "adk_submission", "adk_eval_core", "google.adk"]
numeric_parameters = ["timeout", "startup_timeout", "max_bytes", "concurrency", "retries", "max_attempts"]

[tool.architecture.roots]
"src/gemma_agent_dev" = "gemma_agent_dev"
"kaggle" = "kaggle"
"scripts" = "scripts"

[tool.architecture.modules]
core = ["gemma_agent_dev", "gemma_agent_dev.artifacts", "gemma_agent_dev.config", "gemma_agent_dev.results", "gemma_agent_dev.candidates", "gemma_agent_dev.packaging", "gemma_agent_dev.test_evidence", "gemma_agent_dev.processes", "gemma_agent_dev.provenance", "gemma_agent_dev.analysis", "gemma_agent_dev.gpu_budget"]
settings = ["gemma_agent_dev.diagnostic_config", "gemma_agent_dev.task_catalog", "gemma_agent_dev.submission_config"]
connection = ["gemma_agent_dev.official", "gemma_agent_dev.environment", "gemma_agent_dev.sandbox_sources", "gemma_agent_dev.official_cpu", "gemma_agent_dev.submission_api", "gemma_agent_dev.task_metrics"]
diagnostic = ["gemma_agent_dev.diagnostics", "gemma_agent_dev.qualification", "gemma_agent_dev.runtime_checks"]
local = ["gemma_agent_dev.preflight", "gemma_agent_dev.kaggle_bundle", "gemma_agent_dev.diagnostic_bundle", "gemma_agent_dev.task_report"]
operations = ["gemma_agent_dev.submission", "gemma_agent_dev.submission_store", "gemma_agent_dev.submission_state"]
remote = ["gemma_agent_dev.runtime", "gemma_agent_dev.diagnostic_kaggle", "gemma_agent_dev.worker"]
cli = ["gemma_agent_dev.cli", "gemma_agent_dev.submission_cli"]
entry = ["kaggle.entry"]
quality = ["scripts.check_coverage", "scripts.check_architecture"]

[tool.architecture.allowed]
core = ["core"]
settings = ["core", "settings"]
connection = ["core", "settings", "connection"]
operations = ["core", "settings", "connection", "operations"]
diagnostic = ["core", "settings", "diagnostic"]
local = ["core", "settings", "diagnostic", "local"]
remote = ["core", "connection", "remote"]
cli = ["core", "settings", "diagnostic", "local", "operations", "connection", "cli"]
entry = ["remote"]
quality = ["quality"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
