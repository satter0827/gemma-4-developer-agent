[project]
name = "gemma-agent-dev"
version = "0.1.0"
description = "Reproducible Gemma 4 competition evaluation and result CLI"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
gemma-dev = "gemma_agent_dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_agent_dev"]

[dependency-groups]
submission = ["kaggle==2.2.4"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2", "types-PyYAML>=6,<7", "coverage>=7.10,<8"]

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "artifacts/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "artifacts/cache/mypy"
files = ["src", "tests", "scripts", "agent/skills"]

[[tool.mypy.overrides]]
module = ["swegemma.*", "adk_submission.*", "adk_eval_core.*", "google.adk.*", "google.genai.*", "litellm", "torch", "mlflow.*", "gepa.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "artifacts/cache/pytest"
addopts = "--basetemp=artifacts/tmp/pytest"

[tool.coverage.run]
branch = true
source = ["gemma_agent_dev", "scripts", "agent/skills"]
data_file = "artifacts/coverage/.coverage"
relative_files = true

[tool.coverage.paths]
package = ["src/gemma_agent_dev", "*/site-packages/gemma_agent_dev"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.json]
output = "artifacts/coverage/coverage.json"

[tool.coverage.html]
directory = "artifacts/coverage/html"

[tool.coverage_gate]
line = 90
branch = 80

[tool.gemma_agent_dev.results]
max_artifact_bytes = 2000000

[tool.gemma_agent_dev.logging]
file_level = "INFO"
console_level = "WARNING"
max_bytes = 10485760
backup_count = 3

[tool.architecture]
gpu_free_roles = ["core", "settings", "diagnostic", "local", "cli", "quality", "operations", "workflow"]
inference_imports = ["torch", "litellm", "swegemma", "adk_submission", "adk_eval_core", "google.adk"]
numeric_parameters = ["timeout", "startup_timeout", "max_bytes", "concurrency", "retries", "max_attempts"]

[tool.architecture.roots]
"src/gemma_agent_dev" = "gemma_agent_dev"
"scripts" = "scripts"

[tool.architecture.modules]
core = [
  "gemma_agent_dev.workflows",
  "gemma_agent_dev.workflows.records",
  "gemma_agent_dev.evaluation.experiment_results",
  "gemma_agent_dev.evaluation.optimization_limits",
  "gemma_agent_dev.evaluation.optimization_candidates",
  "gemma_agent_dev.candidates.changes",
  "gemma_agent_dev.common.events",
  "gemma_agent_dev.evaluation.session_policy",
  "gemma_agent_dev.evaluation.control_evidence",
  "gemma_agent_dev",
  "gemma_agent_dev.common",
  "gemma_agent_dev.common.archives",
  "gemma_agent_dev.common.config",
  "gemma_agent_dev.common.paths",
  "gemma_agent_dev.common.sources",
  "gemma_agent_dev.tasks",
  "gemma_agent_dev.diagnostics",
  "gemma_agent_dev.evaluation",
  "gemma_agent_dev.candidates",
  "gemma_agent_dev.notebooks",
  "gemma_agent_dev.submission",
  "gemma_agent_dev.common.artifacts",
  "gemma_agent_dev.evaluation.config",
  "gemma_agent_dev.evaluation.results",
  "gemma_agent_dev.candidates.archive",
  "gemma_agent_dev.candidates.packaging",
  "gemma_agent_dev.common.junit",
  "gemma_agent_dev.common.processes",
  "gemma_agent_dev.common.ownership",
  "gemma_agent_dev.diagnostics.origins",
  "gemma_agent_dev.evaluation.analysis",
  "gemma_agent_dev.evaluation.budget",
]
settings = [
  "gemma_agent_dev.evaluation.record_schema",
  "gemma_agent_dev.tasks.pools",
  "gemma_agent_dev.evaluation.experiments",
  "gemma_agent_dev.diagnostics.config",
  "gemma_agent_dev.tasks.catalog",
  "gemma_agent_dev.submission.config",
]
connection = [
  "gemma_agent_dev.evaluation.optimization_engine",
  "gemma_agent_dev.evaluation.skill_checks",
  "gemma_agent_dev.evaluation.skill_chain",
  "gemma_agent_dev.evaluation.tracking_worker",
  "gemma_agent_dev.evaluation.sequential_checks",
  "gemma_agent_dev.evaluation.official",
  "gemma_agent_dev.notebooks.environment",
  "gemma_agent_dev.diagnostics.sandbox",
  "gemma_agent_dev.evaluation.sdk_worker",
  "gemma_agent_dev.submission.api",
  "gemma_agent_dev.tasks.metrics",
]
diagnostic = [
  "gemma_agent_dev.diagnostics.local",
  "gemma_agent_dev.diagnostics.qualification",
  "gemma_agent_dev.evaluation.sdk_checks",
]
local = [
  "gemma_agent_dev.evaluation.optimization",
  "gemma_agent_dev.evaluation.optimization_preparation",
  "gemma_agent_dev.notebooks.optimization",
  "gemma_agent_dev.tasks.rotation",
  "gemma_agent_dev.evaluation.experiment_records",
  "gemma_agent_dev.evaluation.experiment_preparation",
  "gemma_agent_dev.evaluation.tracking",
  "gemma_agent_dev.notebooks.experiments",
  "gemma_agent_dev.candidates.preflight",
  "gemma_agent_dev.candidates.quality",
  "gemma_agent_dev.notebooks.evaluation",
  "gemma_agent_dev.notebooks.bundle",
  "gemma_agent_dev.notebooks.diagnostics",
  "gemma_agent_dev.tasks.report",
]
operations = [
  "gemma_agent_dev.candidates.experiment_evidence",
  "gemma_agent_dev.candidates.evidence",
  "gemma_agent_dev.submission.service",
  "gemma_agent_dev.submission.store",
  "gemma_agent_dev.submission.state",
]
workflow = ["gemma_agent_dev.workflows.service", "gemma_agent_dev.workflows.transfer"]
remote = [
  "gemma_agent_dev.evaluation.optimization_runtime",
  "gemma_agent_dev.evaluation.optimization_validation",
  "gemma_agent_dev.evaluation.optimization_worker",
  "gemma_agent_dev.evaluation.session",
  "gemma_agent_dev.evaluation.session_worker",
  "gemma_agent_dev.evaluation.runtime",
  "gemma_agent_dev.diagnostics.remote",
  "gemma_agent_dev.notebooks.worker",
]
cli = [
  "gemma_agent_dev.workflows.cli",
  "gemma_agent_dev.evaluation.experiments_cli",
  "gemma_agent_dev.cli",
  "gemma_agent_dev.notebooks.cli",
  "gemma_agent_dev.candidates.cli",
  "gemma_agent_dev.evaluation.cli",
  "gemma_agent_dev.diagnostics.cli",
  "gemma_agent_dev.tasks.cli",
  "gemma_agent_dev.submission.cli",
]
entry = [
  "gemma_agent_dev.notebooks.entry",
]
quality = [
  "scripts.check_coverage",
  "scripts.check_architecture",
]

[tool.architecture.allowed]
core = ["core"]
settings = ["core", "settings"]
connection = ["core", "settings", "connection"]
operations = ["core", "settings", "connection", "operations"]
diagnostic = ["core", "settings", "diagnostic"]
local = ["core", "settings", "diagnostic", "local"]
remote = ["core", "connection", "remote"]
workflow = ["core", "settings", "diagnostic", "local", "operations", "connection"]
cli = ["core", "settings", "diagnostic", "local", "operations", "connection", "cli", "workflow"]
entry = ["remote"]
quality = ["quality"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
