name: Quality checks

on:
  push:
    branches-ignore:
      - codex/submission-state
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.1
      - name: Prepare optimization CPU contract
        run: |
          uv venv artifacts/gepa-env
          uv pip sync --python artifacts/gepa-env/bin/python --require-hashes configs/environments/gepa.lock
      - name: Check package
        run: make check
      - name: Summarize coverage
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/summary.md') != '' }}
        run: cat artifacts/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('artifacts/coverage/coverage.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            artifacts/coverage/coverage.json
            artifacts/coverage/summary.md
            artifacts/coverage/html/
          if-no-files-found: error
      - name: Check submission SDK contract
        env:
          UV_PROJECT_ENVIRONMENT: artifacts/venv
          UV_CACHE_DIR: artifacts/cache/uv
          PYTHONPYCACHEPREFIX: artifacts/cache/python
        run: |
          uv sync --frozen --group submission --no-editable
          uv run --no-sync python -c 'import kagglesdk.kaggle_client'
          uv run --no-sync pytest -q tests/submission/test_submission_api.py -k pinned_sdk --basetemp=artifacts/tmp/submission-sdk
