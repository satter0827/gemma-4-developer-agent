name: Kaggle submissions

on:
  schedule:
    - cron: '15 23 * * *' # 08:15 JST
    - cron: '45 23 * * *' # 08:45 JST
    - cron: '15 11 * * *' # 20:15 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-submissions
  cancel-in-progress: false

jobs:
  submission:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.KAGGLE_SUBMISSION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install submission dependencies
        run: |
          python -m pip install uv==0.12.1
          uv sync --frozen --group submission --no-dev --no-editable
      - name: Check or submit
        id: submission
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=morning
          if [ "$SCHEDULE" = '45 23 * * *' ]; then mode=backup; fi
          if [ "$SCHEDULE" = '15 11 * * *' ]; then mode=monitor; fi
          args=()
          if [ "$EVENT_NAME" = schedule ]; then args+=(--execute); fi
          uv run --no-sync gemma-dev submission --config configs/submission/policy.yaml run --mode "$mode" "${args[@]}"
      - name: Stop expired schedule
        if: >-
          always() && steps.submission.outputs.stop == 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/submissions.yml/disable"
